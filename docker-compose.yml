name: meridian-vote-tracker

services:
  db:
    image: postgres:16-alpine
    environment:
      # Local development defaults so a fresh clone starts with `docker compose up --build`.
      # Override any of them with environment variables or a .env file (see .env.example).
      # The database is only reachable on this machine; use real secrets outside local development.
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian-local-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/MeridianVoteTracker.Api/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-meridian};Username=${POSTGRES_USER:-meridian};Password=${POSTGRES_PASSWORD:-meridian-local-dev}"
      ImportStorage__RootPath: /app/storage
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Uploaded files survive container restarts (the worker re-reads them on retry/resume).
      - importfiles:/app/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: web/meridian-web
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      - api

volumes:
  pgdata:
  importfiles:
