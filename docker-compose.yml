name: meridian-vote-tracker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/MeridianVoteTracker.Api/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ImportStorage__RootPath: /app/storage
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Uploaded files survive container restarts (the worker re-reads them on retry/resume).
      - importfiles:/app/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: web/meridian-web
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      - api

volumes:
  pgdata:
  importfiles:
